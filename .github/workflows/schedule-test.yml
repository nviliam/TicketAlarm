name: Schedule diagnostic

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print UTC time and triggering event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          date -u '+UTC time: %Y-%m-%dT%H:%M:%SZ'
          printf 'Event: %s\n' "$EVENT_NAME"
